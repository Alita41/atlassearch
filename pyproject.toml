[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlassearch"
version = "0.1.0"
description = "Hybrid Urdu-English search and retrieval engine"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4", "numpy>=1.26,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
